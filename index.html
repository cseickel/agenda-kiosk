<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Agenda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    html {
      font-size: 6vh;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: black;
      color: white;
      font-family: Calibri, Helvetica, sans-serif;
      width: 100vw;
      height: 100%;
      display: flex;
    }
    .container {
      display: flex;
      flex: 1;
      flex-direction: column;
      justify-content: top;
      align-items: stretch;
      max-width: 100%;
      text-align: center;
      word-wrap: break-word;
      overflow-wrap: break-word;
      margin: 0.25 em;
      margin-bottom: 1em;
    }
    .today-container {
      border: none !important;
      padding-top: 0.5em;
      padding-bottom: 1.0rem;
      font-weight: 100;
    }
    .day-block {
      border-style: solid;
      border-width: 1px 0 0 0;
      border-image: linear-gradient(to right,
        transparent 26%,
        #222 27%,
        #333 30%,
        #333 70%,
        #222 73%,
        transparent 74%
      ) 1;
      padding-top: 0.85em;
      padding-bottom: 0.85em;
      display: inline-block;
    }
    .day-name {
      font-size: 1em;
      opacity: 0.7;
      margin-left: 0.5em;
    }
    .day-name::before {
      content: "(";
    }
    .day-name::after {
      content: ")";
    }
    .today-name {
      font-size: 1.5rem;
      font-weight: bold;
      display: inline;
      color: steelblue;
    }
    .date-block {
      font-size: 1rem;
      font-weight: 100;
      opacity: 0.8;
      color: lightsteelblue;
      display: inline;
    }
    .time-block {
      font-size: 1.25rem;
      line-height: 1.25rem;
      margin-bottom: 0.5rem;
      font-weight: bold;
      display: inline-block;
      color: steelblue;
    }
    .time-block::before {
      content: "The time is ";
      font-size: 1rem;
      font-weight: 100;
      opacity: 0.8;
      color: lightsteelblue;
      display: inline;
    }
    .days-away {
      font-size: 1rem;
      font-weight: 700;
      display: inline;
    }
    .day-header {
      margin-bottom: 0.1em;
      color: lightsteelblue;
    }
    .date-line {
      font-size: 1em;
      margin-bottom: 0.5em;
      color: lightsteelblue;
      line-height: 0.8em;
    }
    .messages {
      font-size: 1em;
      margin-bottom: 0.2em;
    }
    .message-item {
      margin-bottom: 0.2em;
    }
    .agenda {
      font-size: 1em;
    }
    .agenda-item {
      margin-bottom: 0.1em;
    }
    .agenda-item-countdown {
      color: #f7f4d5;
    }
    .agenda-item-time {
    }
  </style>
</head>
<body>
  <div class="container" id="app"></div>

  <script>
    const DEPLOYMENT_ID = 'AKfycbz6wmtsa31IYSTqvP42Uq_Rg0Q6rKdsnWsPyNhsfDAswMf9_niRDlsQIjo1XyIIEbqt3w';
    const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const JSON_REFETCH_MS = 5 * 60 * 1000;
    const CONTENT_REFRESH_MS = 60 * 1000;
    const MAX_DAYS = 2;

    const EMPTY_MESSAGES = [
      { future: "Free day", today: "This is a free day, enjoy!" },
      { future: "Goof off day", today: "Today, you get to goof off!" },
      { future: "Day off", today: "Take the day off!" },
      { future: "No plans", today: "No plans today, do what you want!" },
      { future: "Nothing to do", today: "Nothing to do today, relax!" },
    ];
    const EmptyMessagesByDay = [];
    // fill the EmptyMessagesByDay array with at least 31 messages
    while (EmptyMessagesByDay.length < 31) {
      EmptyMessagesByDay.push(...EMPTY_MESSAGES);
    }

    function getEmptyDayMessage(date) {
      return EmptyMessagesByDay[date.getDate()];
    }

    let cachedData = null;

    function getJsonUrl() {
      const params = new URLSearchParams(window.location.search);
      const data = params.get('data');
      if (data) {
        // This is for local development, json file specified in URL as ?data=file.json
        return data;
      }
      const sheetsData = `https://script.google.com/macros/s/${DEPLOYMENT_ID}/exec?format=json`;
      const draft = params.get('draft') ? '&draft=true' : '';
      return sheetsData + draft;
    }

    async function fetchData() {
      const url = getJsonUrl();
      if (!url) {
        console.error('No data URL provided. Use ?data=path/to/file.json');
        return null;
      }
      try {
        const response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        cachedData = await response.json();
        return cachedData;
      } catch (err) {
        console.error('Failed to fetch data:', err);
        return cachedData;
      }
    }

    function formatDate(date) {
      const month = MONTHS[date.getMonth()];
      const d = date.getDate();
      const y = date.getFullYear();
      return `${month} ${d}, ${y}`;
    }

    function formatTime(date) {
      let hours = date.getHours();
      const minutes = date.getMinutes();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      const minStr = minutes.toString().padStart(2, '0');
      return `${hours}:${minStr} ${ampm}`;
    }

    function getCountdown(eventDate, now) {
      const diffMs = eventDate - now;
      if (diffMs <= 0) return null;

      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.round(diffMins / 60);
      if (diffMins < 60 && diffHours <= 1) {
        return `${diffMins} minute${diffMins !== 1 ? 's' : ''}`;
      }
      return `${diffHours} hour${diffHours !== 1 ? 's' : ''}`;
    }

    function getDaysAway(eventDate, today) {
      const eventDay = new Date(eventDate.getFullYear(), eventDate.getMonth(), eventDate.getDate());
      const todayDay = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const diffDays = Math.round((eventDay - todayDay) / (1000 * 60 * 60 * 24));
      if (diffDays === 0) return 'Today';
      if (diffDays === 1) return 'Tomorrow';
      return `${diffDays} days from now`;
    }

    function applyStyles(element, styleObj) {
      if (!styleObj) return;
      for (const [key, value] of Object.entries(styleObj)) {
        element.style[key] = value;
      }
    }

    function renderTextArray(textArray) {
      const span = document.createElement('span');
      if (!textArray || !Array.isArray(textArray)) return span;

      for (const item of textArray) {
        const part = document.createElement('span');
        part.textContent = item.content || '';
        applyStyles(part, item.style);
        span.appendChild(part);
      }
      return span;
    }

    function isSameDay(d1, d2) {
      return d1.getFullYear() === d2.getFullYear() &&
             d1.getMonth() === d2.getMonth() &&
             d1.getDate() === d2.getDate();
    }

    function hasTime(date) {
      return date.getHours() !== 0 || date.getMinutes() !== 0;
    }

    function groupAgendaByDay(agenda) {
      const groups = new Map();
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      for (const item of agenda) {
        const date = new Date(item.date);
        const text = item.text.map(t => t.content).join('');
        if (date < today) {
          continue;
        }
        
        const dayKey = `${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`;
        if (!groups.has(dayKey)) {
          groups.set(dayKey, { date, items: [] });
        }
        if (item.showAfter) {
          const showAfter = new Date(item.showAfter);
          if (showAfter > today) {
            //console.log("Skipping item because showAfter",{text, showAfter, today});
            continue;
          }
        }
        groups.get(dayKey).items.push({ ...item, dateObj: date, allDay: !hasTime(date) });
      }
      // Sort groups by date
      const sorted = Array.from(groups.values()).sort((a, b) => a.date - b.date);
      // Sort items within each group by time
      for (const group of sorted) {
        group.items.sort((a, b) => a.dateObj - b.dateObj);
      }
      return sorted;
    }

    function render(data) {
      if (!data) {
        document.getElementById('app').innerHTML = '<p style="font-size:24px;">Loading agenda...</p>';
        return;
      }

      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      const agendaGroups = groupAgendaByDay(data.agenda || []);

      // Generate MAX_DAYS days: today + MAX_DAYS - 1
      const relevantGroups = [];
      for (let i = 0; i < MAX_DAYS; i++) {
        const dayDate = new Date(today);
        dayDate.setDate(dayDate.getDate() + i);

        // Find matching agenda group
        const existing = agendaGroups.find(g => isSameDay(g.date, dayDate));
        relevantGroups.push({
          date: dayDate,
          items: existing ? existing.items : []
        });
      }

      const container = document.getElementById('app');
      const fragment = document.createDocumentFragment();

      const block = document.createElement('div');
      block.className = 'today-container';

      const todayHeader = document.createElement('div');
      todayHeader.className = 'day-header';
      const todayIs = document.createElement('span');
      todayIs.className = 'date-block';
      todayIs.textContent = "Today is ";
      const todayName = document.createElement('span');
      todayName.className = 'today-name';
      todayName.textContent = DAYS[now.getDay()] + " ";
      const dateBlock = document.createElement('span');
      dateBlock.className = 'date-block';
      dateBlock.textContent = formatDate(now);

      todayHeader.appendChild(todayIs);
      todayHeader.appendChild(todayName)
      todayHeader.appendChild(dateBlock);
      block.appendChild(todayHeader);

      const timeBlock = document.createElement('span');
      timeBlock.className = 'time-block';
      timeBlock.textContent = formatTime(now);
      block.appendChild(timeBlock);
      block.style.borderTop = "none";
      block.style.marginTop = "0";
      fragment.appendChild(block);

      relevantGroups.forEach((group, index) => {
        const isToday = isSameDay(group.date, now);
        const scale = 1.0 - (index * 0.02);
        const opacity = Math.pow(0.9, index);

        const block = document.createElement('div');
        block.className = 'day-block';
        block.style.fontSize = `${scale}em`;
        block.style.opacity = opacity;
        block.style.marginLeft = `${index * 3}%`;
        block.style.marginRight = `${index * 3}%`;

        // Day header (name + optional days away)
        const dayHeader = document.createElement('div');
        dayHeader.className = 'day-header';
        const dayName = document.createElement('span');
        dayName.textContent = DAYS[group.date.getDay()];
        dayName.className = 'day-name';
        const daysAwaySpan = document.createElement('span');
        let daysAway = getDaysAway(group.date, now);
        if (daysAway === 'Today') {
          daysAway = "Today's Agenda";
        }
        daysAwaySpan.className = 'days-away';
        daysAwaySpan.textContent = daysAway;
        dayHeader.appendChild(daysAwaySpan);
        dayHeader.appendChild(dayName);
        block.appendChild(dayHeader);


        if (isToday) {
          // Messages
          if (data.messages && data.messages.length > 0) {
            const messagesDiv = document.createElement('div');
            messagesDiv.className = 'messages';
            for (const msg of data.messages) {
              const msgItem = document.createElement('div');
              msgItem.className = 'message-item';
              msgItem.appendChild(renderTextArray(msg.text));
              messagesDiv.appendChild(msgItem);
            }
            block.appendChild(messagesDiv);
          }

          // Today's agenda with times and countdown
          const agendaDiv = document.createElement('div');
          agendaDiv.className = 'agenda';

          const futureItems = group.items.filter(item => item.dateObj.getTime() > now.getTime() || item.allDay);
          if (futureItems.length === 0) {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'agenda-item';
            itemDiv.textContent = getEmptyDayMessage(group.date).today;
            agendaDiv.appendChild(itemDiv);
          } else {
            for (const item of futureItems) {
              const itemDiv = document.createElement('div');
              itemDiv.className = 'agenda-item';

              if (item.allDay) {
                itemDiv.appendChild(renderTextArray(item.text));
              } else {
                const atTime = formatTime(item.dateObj);
                const countdown = getCountdown(item.dateObj, now);
                if (countdown) {
                  const countdownSpan = document.createElement('span');
                  countdownSpan.className = 'agenda-item-countdown';
                  countdownSpan.textContent = `${countdown} from now → `;
                  itemDiv.appendChild(countdownSpan);
                }
                //console.log(item.text.map(t => t.content).join(''), {
                //  item,
                //  atTime,
                //  countdown,
                //});
                itemDiv.appendChild(renderTextArray(item.text));
                const timeSpan = document.createElement('span');
                timeSpan.className = 'agenda-item-time';
                timeSpan.textContent = ` at ${atTime}`;
                itemDiv.appendChild(timeSpan);
              }
              agendaDiv.appendChild(itemDiv);
            }
          }
          block.appendChild(agendaDiv);

        } else {
          // Future agenda
          const agendaDiv = document.createElement('div');
          agendaDiv.className = 'agenda';
          const isTomorrow = getDaysAway(group.date, now) === 'tomorrow';

          if (group.items.length === 0) {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'agenda-item';
            itemDiv.textContent = getEmptyDayMessage(group.date).future;
            agendaDiv.appendChild(itemDiv);
          } else {
            for (const item of group.items) {
              const itemDiv = document.createElement('div');
              itemDiv.className = 'agenda-item';

              // if (isTomorrow && hasTime(item.dateObj)) {
              //   const timeSpan = document.createElement('span');
              //   timeSpan.textContent = formatTime(item.dateObj) + ' - ';
              //   itemDiv.appendChild(timeSpan);
              // }

              itemDiv.appendChild(renderTextArray(item.text));
              agendaDiv.appendChild(itemDiv);
            }
          }
          block.appendChild(agendaDiv);
        }

        fragment.appendChild(block);
      });

      // Swap content in one operation to avoid flicker
      container.innerHTML = '';
      container.appendChild(fragment);
    }

    async function init() {
      const data = await fetchData();
      render(data);

      // refresh page at 4am every day to get new code
      const nextPageReload = new Date();
      if (nextPageReload.getHours() >= 4) {
        nextPageReload.setDate(nextPageReload.getDate() + 1);
      }
      nextPageReload.setHours(4, 0, 0, 0);
      // reload data every 5 minutes
      let lastDataLoad = new Date();

      // Refresh content every minute (uses cached data)
      setInterval(() => {
        if (Date.now() > nextPageReload.getTime()) {
          location.reload();
        } else {
          render(cachedData);
        }
        if (Date.now() > lastDataLoad.getTime() + JSON_REFETCH_MS) {
          fetchData();
          lastDataLoad = new Date();
        }
      }, CONTENT_REFRESH_MS);
    }

    init();
  </script>
</body>
</html>
